name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to publish (e.g. v0.0.87). Must match package.json version.'
        required: true

permissions:
  contents: read
  id-token: write  # Required for npm Trusted Publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'          # Minimum Node that satisfies the pinned npm below
          registry-url: 'https://registry.npmjs.org'
          # NOTE: Do NOT set NODE_AUTH_TOKEN — OIDC handles auth automatically

      - name: Upgrade npm (Trusted Publishing requires 11.5.1+)
        run: |
          # Pinned, not @latest: 11.5.1 is the floor for Trusted Publishing, and an
          # unpinned npm silently upgrades into new majors. npm@12 requires Node
          # >=22.22.2, which broke the v0.1.13 publish on a workflow nobody had touched
          # since May. Bump this deliberately, together with node-version above.
          npm install -g npm@11.5.1
          echo "npm version: $(npm --version)"

      - name: Verify version matches tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          RAW_TAG="${{ github.event.inputs.tag || github.ref_name }}"
          TAG_VERSION="${RAW_TAG#v}"
          echo "package.json: $PKG_VERSION"
          echo "git tag:      $TAG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "❌ Version mismatch! package.json ($PKG_VERSION) != tag ($TAG_VERSION)"
            echo "   Fix: update package.json version to $TAG_VERSION before tagging."
            exit 1
          fi
          echo "✅ Versions match: $PKG_VERSION"

      - name: Install dependencies
        run: npm ci

      - name: Bundle node-datachannel prebuilts
        # Fails the release if any supported platform's binary can't be fetched.
        run: node scripts/fetch-prebuilds.mjs

      - name: Build
        run: npm run build

      - name: Verify package contents
        run: node scripts/verify-package.mjs

      - name: Publish (provenance auto-generated via Trusted Publishing)
        run: npm publish --access public
