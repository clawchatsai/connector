name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to publish (e.g. v0.0.87). Must match package.json version.'
        required: true

permissions:
  contents: read
  id-token: write  # Required for npm Trusted Publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'          # Minimum required for npm Trusted Publishing
          registry-url: 'https://registry.npmjs.org'
          # NOTE: Do NOT set NODE_AUTH_TOKEN — OIDC handles auth automatically

      - name: Verify npm version (needs 11.5.1+)
        run: |
          NPM_VERSION=$(npm --version)
          echo "npm version: $NPM_VERSION"
          node -e "
            const [maj,min,patch] = '$NPM_VERSION'.split('.').map(Number);
            if (maj < 11 || (maj === 11 && min < 5) || (maj === 11 && min === 5 && patch < 1)) {
              console.error('npm too old for Trusted Publishing: $NPM_VERSION (need 11.5.1+)');
              process.exit(1);
            }
            console.log('✅ npm version OK');
          "

      - name: Verify version matches tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          RAW_TAG="${{ github.event.inputs.tag || github.ref_name }}"
          TAG_VERSION="${RAW_TAG#v}"
          echo "package.json: $PKG_VERSION"
          echo "git tag:      $TAG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "❌ Version mismatch! package.json ($PKG_VERSION) != tag ($TAG_VERSION)"
            echo "   Fix: update package.json version to $TAG_VERSION before tagging."
            exit 1
          fi
          echo "✅ Versions match: $PKG_VERSION"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish (provenance auto-generated via Trusted Publishing)
        run: npm publish --access public
