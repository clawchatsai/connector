name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to publish (e.g. v0.0.87). Must match package.json version.'
        required: true

permissions:
  contents: read
  id-token: write  # Required for npm Trusted Publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'          # Minimum required for npm Trusted Publishing
          registry-url: 'https://registry.npmjs.org'
          # NOTE: Do NOT set NODE_AUTH_TOKEN — OIDC handles auth automatically

      - name: Upgrade npm (Trusted Publishing requires 11.5.1+)
        run: |
          npm install -g npm@latest
          echo "npm version: $(npm --version)"

      - name: Verify version matches tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          RAW_TAG="${{ github.event.inputs.tag || github.ref_name }}"
          TAG_VERSION="${RAW_TAG#v}"
          echo "package.json: $PKG_VERSION"
          echo "git tag:      $TAG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "❌ Version mismatch! package.json ($PKG_VERSION) != tag ($TAG_VERSION)"
            echo "   Fix: update package.json version to $TAG_VERSION before tagging."
            exit 1
          fi
          echo "✅ Versions match: $PKG_VERSION"

      - name: Install dependencies
        run: npm ci

      - name: Bundle node-datachannel prebuilts
        run: |
          VERSION=$(node -p "require('./node_modules/node-datachannel/package.json').version")
          echo "Bundling node-datachannel v${VERSION} prebuilts..."
          mkdir -p prebuilds

          PLATFORMS=(
            "linux-x64"
            "linux-arm64"
            "linux-arm"
            "linuxmusl-x64"
            "linuxmusl-arm64"
            "darwin-x64"
            "darwin-arm64"
            "win32-x64"
            "win32-arm64"
          )

          for PLATFORM in "${PLATFORMS[@]}"; do
            URL="https://github.com/murat-dogan/node-datachannel/releases/download/v${VERSION}/node-datachannel-v${VERSION}-napi-v8-${PLATFORM}.tar.gz"
            echo "  Downloading ${PLATFORM}..."
            if curl -fsSL "$URL" -o /tmp/ndc.tar.gz; then
              mkdir -p /tmp/ndc-work
              tar -xzf /tmp/ndc.tar.gz -C /tmp/ndc-work
              BINARY=$(find /tmp/ndc-work -name "*.node" | head -1)
              if [ -n "$BINARY" ]; then
                mkdir -p "prebuilds/${PLATFORM}"
                cp "$BINARY" "prebuilds/${PLATFORM}/node_datachannel.node"
                echo "  ✅ ${PLATFORM}"
              else
                echo "  ⚠️  ${PLATFORM}: .node not found in tarball"
              fi
              rm -rf /tmp/ndc-work /tmp/ndc.tar.gz
            else
              echo "  ⚠️  ${PLATFORM}: download failed (skipping)"
            fi
          done

          echo "Bundled prebuilts:"
          find prebuilds -name "*.node" | sort

      - name: Build
        run: npm run build

      - name: Publish (provenance auto-generated via Trusted Publishing)
        run: npm publish --access public
