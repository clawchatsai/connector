<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<!-- Self-contained ClawChats share page (built by the connector, server/share/viewer-page.js). The content
     below is encrypted; the key is in the link after #, which browsers never send to a server. The
     decrypted artifact renders in a sandboxed iframe (opaque origin) that inherits this policy:
     no network access (connect-src 'none'). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval' https://cdnjs.cloudflare.com; style-src 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src https://fonts.gstatic.com https://cdnjs.cloudflare.com data:; img-src data: blob: https:; media-src data: blob: https:; connect-src 'none'; frame-src 'self' blob: data:; base-uri 'none'; form-action 'none'">
<title>Shared from ClawChats</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%234f8cff%27/%3E%3Cpath d=%27M9 21l5-10 3 6 2-3 4 7z%27 fill=%27%23fff%27/%3E%3C/svg%3E">
<style>
:root { --bg:#0f1115; --panel:#171a21; --border:#2a2f3a; --text:#e6e8ee; --muted:#8b93a7; --primary:#4f8cff; --danger:#ff6b6b; color-scheme:dark; }
* { box-sizing:border-box; }
html, body { height:100%; margin:0; }
body { display:flex; flex-direction:column; background:var(--bg); color:var(--text); font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
.bar { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--border); }
.bar-title { display:flex; align-items:center; gap:8px; min-width:0; }
.brand { font-weight:600; }
.sep { color:var(--muted); }
.title { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.bar-actions { display:flex; align-items:center; gap:12px; flex-shrink:0; }
.meta { color:var(--muted); font-size:13px; }
.btn { padding:6px 12px; border:1px solid var(--border); border-radius:6px; background:transparent; color:var(--text); font:inherit; cursor:pointer; }
.btn:hover { background:#222733; }
.btn.primary { background:var(--primary); border-color:var(--primary); color:#fff; }
.btn:disabled { opacity:.6; cursor:default; }
main { flex:1; display:flex; min-height:0; }
#frame { flex:1; width:100%; border:0; background:#fff; }
.state { margin:auto; max-width:420px; padding:24px; text-align:center; color:var(--muted); }
.pw-form { display:flex; flex-direction:column; gap:10px; text-align:left; color:var(--text); }
.pw-row { display:flex; gap:8px; }
.pw-row input { flex:1; padding:8px 10px; border:1px solid var(--border); border-radius:6px; background:var(--bg); color:var(--text); font:inherit; }
.error { margin:0; color:var(--danger); }
.note { padding:6px 16px; color:var(--muted); font-size:12px; text-align:center; border-top:1px solid var(--border); }
</style>
</head>
<body>
<header class="bar">
  <div class="bar-title"><span class="brand">ClawChats</span><span class="sep">/</span><span id="share-title" class="title">Shared artifact</span></div>
  <div class="bar-actions"><span id="share-meta" class="meta"></span><button id="btn-download" class="btn" type="button" hidden>Download</button></div>
</header>
<main>
  <section id="state" class="state">
    <p id="state-text">Decrypting…</p>
    <form id="pw-form" class="pw-form" hidden>
      <label for="pw-input">This share is password protected.</label>
      <div class="pw-row"><input id="pw-input" type="password" autocomplete="off" placeholder="Password"><button class="btn primary" type="submit">Unlock</button></div>
      <p id="pw-error" class="error" hidden></p>
    </form>
  </section>
  <iframe id="frame" title="Shared content" sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox" hidden></iframe>
</main>
<footer class="note">Shared by a ClawChats user. Don’t enter passwords or personal details into a shared page. Decrypted in your browser; stored encrypted in the sharer’s own storage.</footer>
<script type="application/json" id="share-envelope">{{ENVELOPE_JSON}}</script>
<script>
{{DECRYPT_JS}}

(() => {
  const $ = id => document.getElementById(id);
  const EXT = { html: 'html', svg: 'svg', markdown: 'md', mermaid: 'mmd', csv: 'csv', code: 'txt', chat: 'md' };
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const BASE_CSS = 'body{margin:0;padding:24px;font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;color:#1f2328;background:#fff}'
    + 'pre{margin:0;white-space:pre-wrap;word-break:break-word;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}'
    + 'table{border-collapse:collapse;font-size:14px}td,th{border:1px solid #d0d7de;padding:6px 10px;text-align:left}th{background:#f6f8fa}'
    + '.md{max-width:820px;margin:0 auto}.md img{max-width:100%}.md pre{background:#f6f8fa;padding:12px;border-radius:6px;overflow:auto}'
    + '.md code{font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.center{display:flex;justify-content:center}'
    + 'pre.mermaid{display:block;text-align:center;white-space:pre;font:inherit}';
  const page = (body, head = '') => `<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>${BASE_CSS}</style>${head}</head><body>${body}</body></html>`;
  const lib = (src, sri) => `<script src="${src}" integrity="${sri}" crossorigin="anonymous"><\/script>`;
  const MERMAID = lib('https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.8/mermaid.min.js', 'sha384-N3QqR/7q+xm3BGX+CBbNI8AUmRRqcsDzToy+0z1NLDI0QmTKW8zvwLvqulJgk3dP');
  const MARKED = lib('https://cdnjs.cloudflare.com/ajax/libs/marked/18.0.14/lib/marked.umd.min.js', 'sha384-J1VD5X/E72gORmmXiADelqS192/84qho9IALLC3d5oxjp1RgEN3He4ANyjqXyz10');

  function csvTable(text) {
    const rows = [];
    let row = [], cell = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) {
        if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; }
        else if (c === '"') q = false;
        else cell += c;
      } else if (c === '"') q = true;
      else if (c === ',') { row.push(cell); cell = ''; }
      else if (c === '\n' || c === '\r') {
        if (c === '\r' && text[i + 1] === '\n') i++;
        row.push(cell); rows.push(row); row = []; cell = '';
      } else cell += c;
    }
    if (cell || row.length) { row.push(cell); rows.push(row); }
    if (!rows.length) return '';
    const [head, ...body] = rows;
    return `<table><thead><tr>${head.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>`
      + body.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('') + '</tbody></table>';
  }


  // ── Whole-chat snapshots (type 'chat'): content = {messages, images} built by the ClawChats frontend
  // (frontend/share/chat-snapshot.js). Markdown is rendered inside the sandboxed frame; raw HTML in it is
  // shown as text, like in the app.
  const CHAT_CSS = 'body{padding:0;background:#f6f7f9}@media(prefers-color-scheme:dark){body{background:#0f1115;color:#e6e8ee}'
    + '.msg.user .bubble{background:#1d2a44!important}.tools,.files span{background:#171a21!important;border-color:#2a2f3a!important}'
    + '.md pre,.md code{background:#171a21!important}.tools pre{background:#0b0d11!important;color:#d6dae3}.meta,.divider{color:#8b93a7!important}.divider:before,.divider:after{background:#2a2f3a!important}'
    + 'td,th{border-color:#2a2f3a!important}th{background:#171a21!important}a{color:#6f9bff}}'
    + '.chat{max-width:820px;margin:0 auto;padding:24px 20px 48px}.msg{margin:0 0 22px}.meta{font-size:12px;color:#6b7280;margin:0 0 6px}'
    + '.msg.user{display:flex;flex-direction:column;align-items:flex-end}.msg.user .bubble{background:#e8effd;border-radius:14px;padding:10px 14px;max-width:85%}'
    + '.plain{white-space:pre-wrap;word-break:break-word}.imgs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.imgs img{max-width:240px;max-height:240px;border-radius:8px}'
    + '.md{line-height:1.6;word-break:break-word}.md img{max-width:100%;border-radius:8px}.md pre{background:#eef0f3;padding:12px;border-radius:8px;overflow:auto}'
    + '.md code{background:#eef0f3;padding:1px 4px;border-radius:4px}.md pre code{padding:0;background:none}.md p{margin:0 0 10px}'
    + '.tools{border:1px solid #e3e6eb;border-radius:10px;background:#fff;padding:6px 12px;margin:0 0 10px;font-size:13px}.tools summary{cursor:pointer;color:#5d6676}'
    + '.tools ul{list-style:none;margin:6px 0 2px;padding:0}.tools li{margin:4px 0;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;word-break:break-all}'
    + '.tools .err{color:#d1242f}.tools pre{max-height:320px;overflow:auto;background:#f6f8fa;padding:8px;border-radius:6px;margin:4px 0}'
    + '.files{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.files span{font-size:12.5px;border:1px solid #e3e6eb;border-radius:999px;padding:2px 10px;background:#fff}'
    + '.divider{display:flex;align-items:center;gap:10px;color:#6b7280;font-size:12px;margin:26px 0}.divider:before,.divider:after{content:"";flex:1;height:1px;background:#e3e6eb}';

  function chatPage(content) {
    const messages = Array.isArray(content?.messages) ? content.messages : [];
    const md = [];
    const when = m => (m.time ? ` · <time data-t="${esc(m.time)}"></time>` : '');
    const files = m => (m.files?.length ? `<div class="files">${m.files.map(f => `<span>📎 ${esc(f)}</span>`).join('')}</div>` : '');
    const tools = m => {
      if (!m.tools?.length) return '';
      const rows = m.tools.map(t => {
        const io = t.input != null || t.output != null
          ? `<details><summary>input / output</summary>${t.input != null ? `<pre>${esc(t.input)}</pre>` : ''}${t.output != null ? `<pre>${esc(t.output)}</pre>` : ''}</details>` : '';
        return `<li class="${t.error ? 'err' : ''}">${t.error ? '✗' : '✓'} ${esc(t.title)}${io}</li>`;
      }).join('');
      const label = m.toolSummary || `${m.tools.length} tool call${m.tools.length === 1 ? '' : 's'}`;
      return `<details class="tools"><summary>🔧 ${esc(label)}</summary><ul>${rows}</ul></details>`;
    };
    const body = messages.map(m => {
      if (m.role === 'divider') return `<div class="divider">${esc(m.text || '')}</div>`;
      if (m.role === 'user') {
        const imgs = m.images?.length ? `<div class="imgs">${m.images.map(r => `<img alt="" data-img="${esc(r)}">`).join('')}</div>` : '';
        return `<div class="msg user"><div class="meta">${esc(m.author || 'You')}${when(m)}</div><div class="bubble">`
          + `${m.text ? `<div class="plain">${esc(m.text)}</div>` : ''}${imgs}${files(m)}</div></div>`;
      }
      md.push(String(m.text || ''));
      return `<div class="msg asst"><div class="meta">${esc(m.author || 'Assistant')}${when(m)}</div>${tools(m)}`
        + `<div class="md" data-md="${md.length - 1}"></div>${files(m)}</div>`;
    }).join('');
    const data = JSON.stringify({ md, img: Array.isArray(content?.images) ? content.images : [] }).replace(/</g, '\\u003c');
    const script = '<script>addEventListener("DOMContentLoaded",()=>{'
      + 'const D=JSON.parse(document.getElementById("chat-data").textContent);'
      + 'const esc=s=>String(s).replace(/[&<>"\']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\\"":"&quot;","\'":"&#39;"}[c]));'
      + 'const img=r=>{const m=/^cc-img:(\\d+)$/.exec(r||"");return m&&D.img[+m[1]]||""};'
      + 'marked.use({gfm:true,breaks:true,renderer:{html(t){return esc(t.text||t.raw||"")}}});'
      + 'document.querySelectorAll("[data-md]").forEach(el=>{el.innerHTML=marked.parse(D.md[+el.dataset.md]||"")});'
      + 'document.querySelectorAll("img").forEach(i=>{const r=i.dataset.img||i.getAttribute("src");if(/^cc-img:/.test(r||"")){const u=img(r);if(u)i.src=u;else{i.replaceWith(Object.assign(document.createElement("em"),{textContent:"[image not included]"}))}}});'
      + 'document.querySelectorAll("a[href]").forEach(a=>{a.target="_blank";a.rel="noopener noreferrer"});'
      + 'document.querySelectorAll("time[data-t]").forEach(t=>{const d=new Date(t.dataset.t);if(!isNaN(d))t.textContent=d.toLocaleString(undefined,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})});'
      + '})<\/script>';
    return page(`<main class="chat">${body}</main><script type="application/json" id="chat-data">${data}<\/script>`,
      `<style>${CHAT_CSS}</style>${MARKED}${script}`);
  }

  // Markdown transcript for the Download button.
  function chatMarkdown(title, content) {
    const lines = [`# ${title}`, ''];
    for (const m of content?.messages || []) {
      if (m.role === 'divider') { lines.push('---', ''); continue; }
      const who = m.author || (m.role === 'user' ? 'You' : 'Assistant');
      lines.push(`**${who}**${m.time ? ` · ${m.time}` : ''}`, '');
      if (m.tools?.length) lines.push(m.tools.map(t => `- ${t.error ? '✗' : '✓'} \`${t.title}\``).join('\n'), '');
      const text = String(m.text || '').replace(/!\[([^\]]*)\]\(cc-img:\d+\)/g, '[image: $1]');
      if (text) lines.push(text, '');
      if (m.images?.length) lines.push(m.images.map(() => '[image]').join(' '), '');
      if (m.files?.length) lines.push(m.files.map(f => `📎 ${f}`).join('  '), '');
    }
    return lines.join('\n');
  }

  // The artifact document for the sandboxed iframe. Untrusted content: it only ever goes into srcdoc.
  function build(type, content) {
    switch (type) {
      case 'html': return String(content);
      case 'chat': return chatPage(content);
      case 'svg': return page(`<div class="center">${content}</div>`);
      case 'mermaid':
        return page(`<pre class="mermaid">${esc(content)}</pre>`, MERMAID
          + '<script>addEventListener("DOMContentLoaded",()=>{mermaid.initialize({startOnLoad:false,securityLevel:"strict"});mermaid.run()})<\/script>');
      case 'markdown':
        return page('<article class="md" id="md"></article>', MARKED
          + `<script>addEventListener("DOMContentLoaded",()=>{document.getElementById("md").innerHTML=marked.parse(${JSON.stringify(String(content)).replace(/</g, '\\u003c')})})<\/script>`);
      case 'csv': return page(csvTable(String(content)));
      default: return page(`<pre>${esc(content)}</pre>`);
    }
  }

  function showState(text) { $('state').hidden = false; $('state-text').textContent = text; $('frame').hidden = true; }

  function render(payload) {
    const title = String(payload.title || 'Shared artifact').slice(0, 200);
    document.title = `${title} · ClawChats`;
    $('share-title').textContent = title;
    const d = new Date(payload.createdAt);
    if (!isNaN(d)) $('share-meta').textContent = `Shared ${d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' })}`;
    const btn = $('btn-download');
    btn.hidden = false;
    btn.onclick = () => {
      const ext = payload.type === 'code' ? (payload.language || 'txt') : (EXT[payload.type] || 'txt');
      const a = document.createElement('a');
      const text = payload.type === 'chat' ? chatMarkdown(title, payload.content) : String(payload.content);
      a.href = URL.createObjectURL(new Blob([text], { type: 'text/plain' }));
      a.download = `${title.replace(/[^\w.-]+/g, '-').replace(/^-+|-+$/g, '') || 'artifact'}.${String(ext).replace(/\W/g, '') || 'txt'}`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    };
    const frame = $('frame');
    frame.srcdoc = build(payload.type, payload.content);
    frame.hidden = false;
    $('state').hidden = true;
  }

  async function main() {
    let envelope;
    try { envelope = JSON.parse($('share-envelope').textContent); } catch { return showState('This share is damaged.'); }
    if (!needsPassword(envelope)) {
      const secret = new URLSearchParams(location.hash.slice(1)).get('k');
      if (!secret) return showState('This link is missing its key. Copy the full link, including the part after #.');
      try { render(await decryptShare(envelope, { secret })); } catch (err) { showState(err.message); }
      return;
    }
    $('state-text').textContent = '';
    const form = $('pw-form');
    form.hidden = false;
    $('pw-input').focus();
    form.onsubmit = async e => {
      e.preventDefault();
      const btn = form.querySelector('button');
      btn.disabled = true;
      $('pw-error').hidden = true;
      try { render(await decryptShare(envelope, { password: $('pw-input').value })); }
      catch (err) { $('pw-error').textContent = err.message; $('pw-error').hidden = false; }
      finally { btn.disabled = false; }
    };
  }
  main();
})();
</script>
</body>
</html>
